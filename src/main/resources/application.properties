#==================== Servidor ====================
server.port=${SERVER_PORT:8000}
spring.application.name=thindesk
server.error.whitelabel.enable=false

#==================== MongoDB (Atlas ou local) ====================
# O valor vem de variável de ambiente (.env) — NUNCA hardcoded!
#   Atlas: mongodb+srv://USUARIO:SENHA@cluster0.xxxxx.mongodb.net/thindesk?retryWrites=true&w=majority
#   Local: mongodb://localhost:27017/thindesk
# URI de conexão com o MongoDB Atlas.
spring.data.mongodb.uri=${MONGO_URI}
# Cria os índices: @Indexed(unique) em usuarios e o índice TTL de email_tokens.
spring.data.mongodb.auto-index-creation=true

#==================== JWT ====================
# Gere com: openssl rand -base64 64
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=3600000
app.jwt.issuer=thindesk-api

#==================== 2FA (puzzle) ====================
app.security.puzzle.enabled=true
# Erros permitidos por puzzle; ao atingir, um NOVO puzzle é gerado
app.security.puzzle.max-tentativas=5
# Só puzzles com rating <= este valor (usado no import e no sorteio)
app.security.puzzle.rating-max=${PUZZLE_RATING_MAX:1100}
# Tempo para resolver cada puzzle; ao esgotar, um NOVO puzzle é gerado (300 s = 5 min)
app.security.puzzle.tempo-limite-segundos=${PUZZLE_TEMPO_LIMITE:300}
# Quantos puzzles um mesmo login pode consumir (anti força bruta); depois exige novo login
app.security.puzzle.max-puzzles-por-sessao=${PUZZLE_MAX_POR_SESSAO:3}

#==================== Tokens por email (uso único) ====================
# Link do login (enviado depois do puzzle)
app.security.email-token.login-minutos=15
# Link de confirmação do cadastro
app.security.email-token.registro-horas=24

#==================== Desenvolvimento / testes ====================
# SOMENTE para testes automatizados (test.sh): devolve o link do email no JSON.
# Em produção/entrega deixe false — com true, quem tem a senha e resolve o puzzle recebe o link sem abrir o email!
app.dev.expor-link-confirmacao=${DEV_EXPOR_LINK:false}
# Email do usuário admin criado pelo seed (recebe os links de login)
app.admin.email=${ADMIN_EMAIL:admin@thindesk.local}

#==================== Base URL (usada nos links dos emails) ====================
app.base-url=${APP_BASE_URL:http://localhost:8000}


#==================== Email ====================
# Com MAIL_ENABLED=false o link aparece no console do servidor
app.mail.enabled=${MAIL_ENABLED:false}

spring.mail.host=${MAIL_HOST:smtp.mailtrap.io}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
spring.mail.properties.mail.smtp.starttls.required=true
