<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Criar conta — Thindesk</title>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css"
    />
    <style>
      body {
        background: #f8f9fa;
      }
      .card-registro {
        max-width: 440px;
        margin: 3rem auto;
        padding: 2rem;
        background: #fff;
        border-radius: 8px;
        box-shadow: 0 4px 8px rgba(0, 0, 0, 0.15);
      }
    </style>
  </head>
  <body>
    <div class="card-registro">
      <h3 class="text-center mb-4">Criar conta</h3>

      <!-- Formulário de cadastro; envia dados para /api/auth/registrar. -->
      <form id="registroForm">
        <div class="mb-3">
          <label for="nomeCompleto" class="form-label">Nome completo</label>
          <input
            type="text"
            class="form-control"
            id="nomeCompleto"
            maxlength="100"
            required
          />
        </div>
        <div class="mb-3">
          <label for="username" class="form-label">Usuário</label>
          <input
            type="text"
            class="form-control"
            id="username"
            minlength="3"
            maxlength="30"
            autocomplete="username"
            required
          />
          <div class="form-text">
            3 a 30 caracteres: letras (com acento), números, espaço entre palavras e . _ - @ +
          </div>
        </div>
        <div class="mb-3">
          <label for="email" class="form-label">Email</label>
          <input
            type="email"
            class="form-control"
            id="email"
            maxlength="120"
            autocomplete="email"
            required
          />
          <div class="form-text">Enviaremos um link para ativar a conta.</div>
        </div>
        <div class="mb-3">
          <label for="password" class="form-label">Senha</label>
          <div class="input-group">
            <input
              type="password"
              class="form-control"
              id="password"
              minlength="6"
              maxlength="72"
              autocomplete="new-password"
              required
            />
            <button
              type="button"
              class="btn btn-outline-secondary"
              data-toggle-senha="#password"
            ></button>
          </div>
          <div class="form-text">Mínimo de 6 caracteres.</div>
        </div>

        <div class="mb-3">
          <label for="confirmar" class="form-label">Confirmar senha</label>
          <div class="input-group">
            <input type="password" class="form-control" id="confirmar" autocomplete="new-password" required />
            <button type="button" class="btn btn-outline-secondary" data-toggle-senha="#confirmar"></button>
          </div>
        </div>
        <div id="msg" class="mb-2" style="min-height: 1.2em" role="status"></div>
        <button type="submit" class="btn btn-primary w-100">Cadastrar</button>
        <a href="/login" class="btn btn-link w-100 mt-2">Já tenho conta</a>
        <a href="/reenviar-confirmacao" class="btn btn-link w-100">Não recebi o email de confirmação</a>
      </form>
    </div>

    <script src="/js/senha-toggle.js"></script>
    <script>
      const msg = document.getElementById("msg");

      function mostrar(texto, ok) {
        msg.textContent = texto; // textContent: nunca interpreta HTML
        msg.className = "mb-2 " + (ok ? "text-success" : "text-danger");
      }

      document
        .getElementById("registroForm")
        .addEventListener("submit", async (e) => {
          e.preventDefault();
          mostrar("", true);

          const corpo = {
            nomeCompleto: document.getElementById("nomeCompleto").value.trim(),
            username: document.getElementById("username").value.trim().normalize("NFC"),
            email: document.getElementById("email").value.trim(),
            password: document.getElementById("password").value,
          };
          if (corpo.password !== document.getElementById("confirmar").value) {
            mostrar("As senhas não são iguais.", false);
            return;
          }
          if (new TextEncoder().encode(corpo.password).length > 72) {
            mostrar("A senha ultrapassa 72 bytes. Use uma senha menor (acentos ocupam mais de um byte).", false);
            return;
          }
          const botao = e.target.querySelector('[type="submit"]');
          if (botao.disabled) return;
          botao.disabled = true;
          botao.textContent = "Cadastrando...";

          try {
            // Chamada à API de registro; exibe mensagem de sucesso ou erro.
            const resp = await fetch("/api/auth/registrar", {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify(corpo),
            });
            const dados = await resp.json().catch(() => ({}));

            if (resp.status === 201) {
              mostrar(dados.mensagem, dados.emailEnviado !== false);
              document.getElementById("registroForm").reset();
              return;
            }
            mostrar(
              dados.erro || "Não foi possível concluir o cadastro.",
              false,
            );
          } catch (ex) {
            mostrar("Erro ao contatar o servidor.", false);
            console.error(ex);
          } finally {
            botao.disabled = false;
            botao.textContent = "Cadastrar";
          }
        });
    </script>
    
    <!-- Ícones de desafio (rainha vermelha, cavalo verde, torre azul) -->
    <div th:replace="~{fragments/rainha :: rainha}"></div>
  </body>
</html>
