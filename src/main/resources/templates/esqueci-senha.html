<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Esqueci minha senha — Thindesk</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" />
    <style>
      body { background: #f8f9fa; }
      .card-senha { max-width: 420px; margin: 4rem auto; padding: 2rem; background: #fff;
                    border-radius: 8px; box-shadow: 0 4px 8px rgba(0, 0, 0, 0.15); }
      .logo { width: 90px; height: auto; margin-bottom: 1rem; }
    </style>
  </head>
  <body>
    <div class="card-senha text-center">
      <img th:src="@{/images/logo.png}" alt="Logo" class="logo" />
      <h4 class="mb-2">Esqueci minha senha</h4>
      <p class="text-muted small">
        Digite o email da sua conta. Se ele estiver cadastrado, enviaremos um link para criar uma nova senha.
        Se o cadastro nunca foi confirmado, reenviamos o link de confirmação.
      </p>

      <form id="form" novalidate>
        <div class="mb-3 text-start">
          <label for="email" class="form-label">Email</label>
          <input type="email" class="form-control" id="email" maxlength="120" autocomplete="email" required />
        </div>
        <div id="msg" class="mb-2" style="min-height: 1.2em" role="status"></div>
        <button type="submit" id="enviar" class="btn btn-primary w-100">Enviar link</button>
        <a href="/login" class="btn btn-link w-100 mt-2">Voltar ao login</a>
      </form>
    </div>

    <script>
      const msg = document.getElementById("msg");
      const mostrar = (t, ok) => { msg.textContent = t; msg.className = "mb-2 " + (ok ? "text-success" : "text-danger"); };

      document.getElementById("form").addEventListener("submit", async (e) => {
        e.preventDefault();
        const email = document.getElementById("email").value.trim();
        if (!email || !document.getElementById("email").checkValidity()) {
          mostrar("Digite um email válido.", false);
          return;
        }
        const botao = document.getElementById("enviar");
        botao.disabled = true;
        mostrar("Enviando...", true);
        try {
          const resp = await fetch("/api/auth/esqueci-senha", { method: "POST", body: new URLSearchParams({ email }) });
          const d = await resp.json().catch(() => ({}));
          if (resp.ok) {
            mostrar(d.mensagem, true);
            document.getElementById("form").reset();
            // evita pedidos em sequência: o botão volta depois de um tempo
            setTimeout(() => (botao.disabled = false), 15000);
            return;
          }
          mostrar(d.erro || "Não foi possível enviar agora.", false);
        } catch (ex) {
          mostrar("Erro ao contatar o servidor.", false);
        }
        botao.disabled = false;
      });
    </script>
  </body>
</html>
