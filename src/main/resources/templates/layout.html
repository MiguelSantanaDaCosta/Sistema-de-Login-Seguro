<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Thindesk</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" th:href="@{/css/style.css}" />

    <!-- Tema ativo do usuário (injetado pelo GlobalModelAdvice). -->
    <link
      rel="stylesheet"
      th:href="@{'/css/themes/' + (${temaAtivo} ?: 'gruvbox-dark') + '.css'}"
    />
  </head>

  <body th:attr="data-theme=${temaAtivo} ?: 'default'">
    <div class="toggle-btn btn btn-dark d-md-none">
      <span>&#9776;</span>
    </div>

    <aside>
      <div th:replace="~{fragments/sidebar :: sidebar}"></div>
    </aside>

    <!-- Fragmento dinâmico: o controller injeta "template :: content" -->
    <main class="container-fluid mt-4">
      <!-- content = "template :: fragmento". O Thymeleaf 3.1 não aceita mais essa string inteira no th:replace;
           o separador é montado com ':'+':' para o parser de fragmentos não cortar a expressão. -->
      <div th:replace="~{${#strings.trim(#strings.substringBefore(content, ':' + ':'))} :: ${#strings.trim(#strings.substringAfter(content, ':' + ':'))}}"></div>
    </main>

    <script th:src="@{/js/script.js}"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
