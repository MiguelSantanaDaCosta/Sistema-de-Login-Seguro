<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>A Rainha Vermelha</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" />
    <link rel="stylesheet" href="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.css" />
    <link rel="stylesheet" th:href="@{/css/puzzle-modal.css}" />
    <style>
      body { background: #1a0709; color: #f3d9dc; }
      .rainha-titulo { color: #ff2b3d; text-shadow: 0 0 10px rgba(255,43,61,.5); }
      #board-wrap { max-width: 420px; width: 100%; margin: 0 auto; }
      .tempo { font-variant-numeric: tabular-nums; font-size: 1.6rem; font-weight: 700; }
      .tempo.urgente { color: #ff8a80; }
      .passos span { display:inline-block; width:14px; height:14px; margin:0 3px; border-radius:50%; background:#4a2025; }
      .passos span.ok { background:#ff2b3d; }
      .passos span.atual { box-shadow: 0 0 0 3px #ff2b3d55; background:#9b1c28; }
    </style>
  </head>
  <body>
    <div class="container py-4 text-center">
      <h1 class="rainha-titulo">&#9819; A Rainha Vermelha</h1>
      <p class="mb-1">
        Resolva <b th:text="${@rootProps.puzzles}">5</b> puzzles <b>seguidos</b> em
        <b th:text="${@rootProps.tempoSegundos / 60}">5</b> min, sem errar nenhum.
        Só os de maior rating do banco.
      </p>
      <p class="small text-secondary">Errou um lance? Tudo recomeça.</p>

      <!-- isca para bots: humano não vê nem preenche -->
      <input type="text" id="website" name="website" tabindex="-1" autocomplete="off"
             aria-hidden="true" style="position:absolute;left:-9999px;opacity:0;height:0;width:0" />

      <div id="inicio">
        <button id="btn-iniciar" class="btn btn-danger btn-lg">Aceitar o desafio</button>
        <div><a th:href="@{/login}" class="btn btn-link text-secondary mt-3">Voltar ao login</a></div>
      </div>

      <div id="jogo" style="display:none">
        <div class="d-flex justify-content-center align-items-center gap-4 mb-2">
          <span class="tempo" id="tempo">05:00</span>
          <span id="numero"></span>
          <span id="vez" class="text-secondary"></span>
          <span id="rating" class="text-secondary"></span>
        </div>
        <div class="passos mb-2" id="passos"></div>
        <div id="board-wrap"><div id="board"></div></div>
        <div id="msg" class="mt-3 fw-bold"></div>
        <button id="btn-reiniciar" class="btn btn-outline-danger mt-2" style="display:none">Tentar de novo</button>
      </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
    <script src="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.js"></script>
    <script th:src="@{/js/root-desafio.js}"></script>
  </body>
</html>
