<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <title>Técnico — Chamados</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" th:href="@{/css/style.css}" />
  </head>
  <body>
    <aside>
      <div th:replace="~{fragments/sidebar :: sidebar}"></div>
    </aside>

    <div class="container mt-4" th:fragment="content">
      <h2 class="mb-4">
        Fila de Chamados — <span th:text="${usuarioAtual}"></span>
      </h2>

      <table class="table table-striped">
        <thead>
          <tr>
            <th>Descrição</th>
            <th>Status</th>
            <th>Técnico</th>
            <th>Usuário</th>
            <th>Ações</th>
          </tr>
        </thead>
        <tbody>
          <tr th:each="c : ${chamados}">
            <td th:text="${c.descricao}"></td>
            <td>
              <span class="badge bg-secondary" th:text="${c.status}"></span>
            </td>
            <td th:text="${c.tecnico}"></td>
            <td th:text="${c.usuario}"></td>
            <td>
              <form
                th:action="@{'/tecnico/chamados/' + ${c.id} + '/assumir'}"
                method="post"
                class="d-inline"
              >
                <button class="btn btn-sm btn-primary">Assumir</button>
              </form>
              <form
                th:action="@{'/tecnico/chamados/' + ${c.id} + '/status'}"
                method="post"
                class="d-inline"
              >
                <input type="hidden" name="status" value="Concluído" />
                <button class="btn btn-sm btn-success">Concluir</button>
              </form>
            </td>
          </tr>
        </tbody>
      </table>
    </div>

    <script th:src="@{/js/script.js}"></script>
  </body>
</html>
