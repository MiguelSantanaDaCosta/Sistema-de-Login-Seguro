<div th:fragment="content" class="container-fluid"
     xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
  <h1 class="mt-4">Ajustes de Horários por Setor</h1>
  <div th:if="${sucesso}" class="alert alert-success" role="status" th:text="${sucesso}"></div>
  <p>Consulte os dias e horários de atendimento. Administradores podem cadastrar e remover faixas.</p>

  <form th:action="@{/ajustes-horarios/salvar}" th:object="${novoHorario}"
        method="post" class="mb-4" sec:authorize="hasRole('ADMIN')">
    <div th:if="${#fields.hasAnyErrors()}" class="alert alert-danger">
      <p th:each="erro : ${#fields.allErrors()}" th:text="${erro}" class="mb-0"></p>
    </div>
    <div class="row">
      <div class="col-md-3">
        <label for="setor" class="form-label">Setor</label>
        <input type="text" id="setor" name="setor" th:value="*{setor}"
               class="form-control" required />
      </div>
      <div class="col-md-2">
        <label for="diaSemana" class="form-label">Dia</label>
         <select id="diaSemana" th:field="*{diaSemana}" class="form-select" required>
           <option value="">Selecione</option>
           <option th:each="dia : ${ {'Segunda-feira','Terça-feira','Quarta-feira','Quinta-feira','Sexta-feira','Sábado','Domingo'} }"
                   th:value="${dia}" th:text="${dia}"></option>
         </select>
      </div>
      <div class="col-md-2">
        <label for="horarioInicio" class="form-label">Início</label>
        <input type="time" id="horarioInicio" name="horarioInicio"
               th:value="*{horarioInicio}" class="form-control" required />
      </div>
      <div class="col-md-2">
        <label for="horarioFim" class="form-label">Fim</label>
        <input type="time" id="horarioFim" name="horarioFim"
               th:value="*{horarioFim}" class="form-control" required />
      </div>
      <div class="col-md-3 d-flex align-items-end">
        <button type="submit" class="btn btn-primary">Salvar</button>
      </div>
    </div>
  </form>

  <div class="table-responsive"><table class="table table-striped">
    <thead>
      <tr><th>Setor</th><th>Dia</th><th>Início</th><th>Fim</th><th sec:authorize="hasRole('ADMIN')">Ações</th></tr>
    </thead>
    <tbody>
      <tr th:if="${#lists.isEmpty(horarios)}"><td colspan="5">Nenhum horário cadastrado.</td></tr>
      <tr th:each="horario : ${horarios}">
        <td th:text="${horario?.setor}"></td>
        <td th:text="${horario?.diaSemana}"></td>
        <td th:text="${horario?.horarioInicio}"></td>
        <td th:text="${horario?.horarioFim}"></td>
        <td sec:authorize="hasRole('ADMIN')">
          <form th:action="@{/ajustes-horarios/deletar/{id}(id=${horario.id})}" method="post">
            <button class="btn btn-danger btn-sm">Excluir</button>
          </form>
        </td>
      </tr>
    </tbody>
  </table></div>
</div>
