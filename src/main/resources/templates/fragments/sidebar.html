<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <div th:fragment="sidebar">
      <div id="sidebar">
        <h4 class="text-center py-3">Thindesk Menu</h4>

        <ul class="nav flex-column">
          <li class="nav-item">
            <a class="nav-link" th:href="@{/}" aria-current="page">
              <i aria-hidden="true" class="bi bi-house"></i>
              <span>Início</span>
            </a>
          </li>

          <li class="nav-item">
            <a class="nav-link" th:href="@{/chamados}">
              <i aria-hidden="true" class="bi bi-headset"></i>
              <span>Chamados</span>
            </a>
          </li>

          <li class="nav-item">
            <a class="nav-link" th:href="@{/clientes}">
              <i aria-hidden="true" class="bi bi-person"></i>
              <span>Clientes</span>
            </a>
          </li>
          <!-- Área do técnico — visível só para TECNICO ou ADMIN -->
          <li
            class="nav-item"
            sec:authorize="hasAnyRole('TECNICO', 'ADMIN')"
            xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
          >
            <a class="nav-link" th:href="@{/tecnico/chamados}">
              <i aria-hidden="true" class="bi bi-wrench-adjustable"></i>
              <span>Fila técnica</span>
            </a>
          </li>

          <!-- Painel root (banco de dados) — só ROOT -->
          <li
            class="nav-item"
            sec:authorize="hasRole('ROOT')"
            xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
          >
            <a class="nav-link text-danger" th:href="@{/root}">
              <i aria-hidden="true" class="bi bi-database-fill-gear"></i>
              <span>Banco (root)</span>
            </a>
          </li>

          <!-- Área admin — só ADMIN -->
          <li
            class="nav-item"
            sec:authorize="hasRole('ADMIN')"
            xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
          >
            <a class="nav-link" th:href="@{/admin/usuarios}">
              <i aria-hidden="true" class="bi bi-shield-lock"></i>
              <span>Usuários</span>
            </a>
          </li>
          <li
            class="nav-item"
            sec:authorize="hasRole('ADMIN')"
            xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
          >
            <a class="nav-link" th:href="@{/admin/demos}">
              <i aria-hidden="true" class="bi bi-person-badge"></i>
              <span>Contas demo</span>
            </a>
          </li>

          <li class="nav-item">
            <a class="nav-link" href="#" onclick="toggleSubmenu(event, this)">
              <i aria-hidden="true" class="bi bi-gear"></i>
              <span>Configurações</span>
              <span class="float-end">&#9662;</span>
            </a>
            <ul class="nav flex-column submenu">
              <li class="nav-item">
                <a class="nav-link" th:href="@{/tecnicos}">
                  <i aria-hidden="true" class="bi bi-person"></i>
                  <span>Técnicos</span>
                </a>
              </li>
              <li class="nav-item">
                <a class="nav-link" th:href="@{/tipo-chamado}">
                  <i aria-hidden="true" class="bi bi-megaphone"></i>
                  <span>Tipo de Chamado</span>
                </a>
              </li>
              <li class="nav-item">
                <a class="nav-link" th:href="@{/ajustes-horarios}">
                  <i aria-hidden="true" class="bi bi-alarm"></i>
                  <span>Horário de Atendimento</span>
                </a>
              </li>
              <li class="nav-item">
                <a class="nav-link" th:href="@{/recursos}">
                  <i aria-hidden="true" class="bi bi-screwdriver"></i>
                  <span>Recursos</span>
                </a>
              </li>
            </ul>
          </li>

          <!-- Botão Sair — dentro do <ul>, com separador -->
          <li class="nav-item mt-3 border-top pt-2">
            <a class="nav-link" href="#" onclick="logout(event)">
              <i aria-hidden="true" class="bi bi-box-arrow-right"></i>
              <span>Sair</span>
            </a>
          </li>
        </ul>
        <div class="text-center small mt-4 opacity-50"
             th:text="'Thindesk v' + ${@environment.getProperty('app.version')}">Thindesk</div>
      </div>
    </div>
  </body>
</html>
