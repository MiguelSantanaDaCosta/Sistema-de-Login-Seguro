<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <div th:fragment="sidebar">
      <div id="sidebar">
        <h4 class="text-center py-3">Thindesk Menu</h4>

        <ul class="nav flex-column">
          <li class="nav-item">
            <a class="nav-link" th:href="@{/}" aria-current="page">
              <i class="bi bi-house"></i>
              <span class="d-none d-md-inline">Início</span>
            </a>
          </li>

          <li class="nav-item">
            <a class="nav-link" th:href="@{/chamados}">
              <i class="bi bi-headset"></i>
              <span class="d-none d-md-inline">Chamados</span>
            </a>
          </li>

          <li class="nav-item">
            <a class="nav-link" th:href="@{/clientes}">
              <i class="bi bi-person"></i>
              <span class="d-none d-md-inline">Clientes</span>
            </a>
          </li>
          <!-- Área do técnico — visível só para TECNICO ou ADMIN -->
          <li
            class="nav-item"
            sec:authorize="hasAnyRole('TECNICO', 'ADMIN')"
            xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
          >
            <a class="nav-link" th:href="@{/tecnico/chamados}">
              <i class="bi bi-wrench-adjustable"></i>
              <span class="d-none d-md-inline">Fila técnica</span>
            </a>
          </li>

          <!-- Área admin — só ADMIN -->
          <li
            class="nav-item"
            sec:authorize="hasRole('ADMIN')"
            xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
          >
            <a class="nav-link" th:href="@{/admin/usuarios}">
              <i class="bi bi-shield-lock"></i>
              <span class="d-none d-md-inline">Usuários</span>
            </a>
          </li>

          <li class="nav-item">
            <a class="nav-link" href="#" onclick="toggleSubmenu(event, this)">
              <i class="bi bi-gear"></i>
              <span class="d-none d-md-inline">Configurações</span>
              <span class="float-end">&#9662;</span>
            </a>
            <ul class="nav flex-column submenu">
              <li class="nav-item">
                <a class="nav-link" th:href="@{/tecnicos}">
                  <i class="bi bi-person"></i>
                  <span class="d-none d-md-inline">Técnicos</span>
                </a>
              </li>
              <li class="nav-item">
                <a class="nav-link" th:href="@{/tipo-chamado}">
                  <i class="bi bi-megaphone"></i>
                  <span class="d-none d-md-inline">Tipo de Chamado</span>
                </a>
              </li>
              <li class="nav-item">
                <a class="nav-link" th:href="@{/ajustes-horarios}">
                  <i class="bi bi-alarm"></i>
                  <span class="d-none d-md-inline">Horário de Atendimento</span>
                </a>
              </li>
              <li class="nav-item">
                <a class="nav-link" th:href="@{/recursos}">
                  <i class="bi bi-screwdriver"></i>
                  <span class="d-none d-md-inline">Recursos</span>
                </a>
              </li>
            </ul>
          </li>

          <!-- Botão Sair — dentro do <ul>, com separador -->
          <li class="nav-item mt-3 border-top pt-2">
            <a class="nav-link" href="#" onclick="logout(event)">
              <i class="bi bi-box-arrow-right"></i>
              <span class="d-none d-md-inline">Sair</span>
            </a>
          </li>
        </ul>
      </div>
    </div>
  </body>
</html>
