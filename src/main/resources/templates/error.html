<!doctype html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Erro — Thindesk</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <style>
      body {
        background: #1d2021;
        color: #ebdbb2;
        font-family: "JetBrains Mono", "Fira Code", "Menlo", monospace;
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        margin: 0;
      }
      .box {
        text-align: center;
        padding: 3rem 2rem;
        border: 1px solid #504945;
        border-radius: 12px;
        background: #282828;
        max-width: 480px;
      }
      .code {
        font-size: 4rem;
        font-weight: 700;
        color: #fb4934;
        line-height: 1;
        margin-bottom: 0.5rem;
      }
      h1 {
        color: #fabd2f;
        font-size: 1.5rem;
        margin-bottom: 1rem;
      }
      p {
        color: #d5c4a1;
        margin-bottom: 1.5rem;
      }
      a {
        color: #83a598;
        text-decoration: none;
      }
      a:hover {
        color: #fe8019;
        text-decoration: underline;
      }
    </style>
  </head>
  <body>
    <div class="box">
      <div class="code" th:text="${status ?: '?'}">?</div>
      <h1 th:text="${error ?: 'Algo deu errado'}">Algo deu errado</h1>
      <p
        th:text="${message ?: 'Não foi possível carregar a página solicitada.'}"
      >
        Não foi possível carregar a página solicitada.
      </p>
      <a href="/login" class="btn btn-outline-light btn-sm"
        >Voltar para o login</a
      >
      <a href="/" class="btn btn-outline-secondary btn-sm ms-2"
        >Ir para o início</a
      >
    </div>
  </body>
</html>
