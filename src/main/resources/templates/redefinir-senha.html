<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Nova senha — Thindesk</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" />
    <style>
      body { background: #f8f9fa; }
      .card-senha { max-width: 420px; margin: 4rem auto; padding: 2rem; background: #fff;
                    border-radius: 8px; box-shadow: 0 4px 8px rgba(0, 0, 0, 0.15); }
      .logo { width: 90px; height: auto; margin-bottom: 1rem; }
    </style>
  </head>
  <body>
    <div class="card-senha text-center">
      <img th:src="@{/images/logo.png}" alt="Logo" class="logo" />
      <h4 class="mb-2">Criar nova senha</h4>
      <p class="text-muted small">Escolha uma nova senha (6 a 72 caracteres). Use o olho para conferir o que digitou.</p>

      <form id="form" novalidate>
        <input type="hidden" id="token" th:value="${token}" />
        <div class="mb-3 text-start">
          <label for="senha" class="form-label">Nova senha</label>
          <div class="input-group">
            <input type="password" class="form-control" id="senha" minlength="6" maxlength="72"
                   autocomplete="new-password" required />
            <button type="button" class="btn btn-outline-secondary" data-toggle-senha="#senha"></button>
          </div>
        </div>
        <div class="mb-3 text-start">
          <label for="confirmar" class="form-label">Confirmar nova senha</label>
          <div class="input-group">
            <input type="password" class="form-control" id="confirmar" minlength="6" maxlength="72"
                   autocomplete="new-password" required />
            <button type="button" class="btn btn-outline-secondary" data-toggle-senha="#confirmar"></button>
          </div>
        </div>
        <div id="msg" class="mb-2" style="min-height: 1.2em" role="status"></div>
        <button type="submit" id="salvar" class="btn btn-primary w-100">Salvar nova senha</button>
        <a href="/esqueci-senha" class="btn btn-link w-100 mt-2">Pedir um novo link</a>
      </form>
    </div>

    <script src="/js/senha-toggle.js"></script>
    <script>
      const msg = document.getElementById("msg");
      const mostrar = (t, ok) => { msg.textContent = t; msg.className = "mb-2 " + (ok ? "text-success" : "text-danger"); };

      document.getElementById("form").addEventListener("submit", async (e) => {
        e.preventDefault();
        const senha = document.getElementById("senha").value;
        const confirmar = document.getElementById("confirmar").value;
        const token = document.getElementById("token").value;
        if (!token) { mostrar("Link inválido. Peça um novo em \"Esqueci minha senha\".", false); return; }
        if (senha.length < 6 || senha.length > 72) { mostrar("A senha deve ter entre 6 e 72 caracteres.", false); return; }
        if (senha !== confirmar) { mostrar("As senhas não são iguais.", false); return; }

        const botao = document.getElementById("salvar");
        botao.disabled = true;
        try {
          const resp = await fetch("/api/auth/redefinir-senha", {
            method: "POST",
            body: new URLSearchParams({ token, password: senha }),
          });
          const d = await resp.json().catch(() => ({}));
          if (resp.ok) {
            mostrar(d.mensagem, true);
            setTimeout(() => (window.location = "/login?senha=redefinida"), 1200);
            return;
          }
          mostrar(d.erro || "Não foi possível redefinir a senha.", false);
        } catch (ex) {
          mostrar("Erro ao contatar o servidor.", false);
        }
        botao.disabled = false;
      });
    </script>
  </body>
</html>
