<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, shrink-to-fit=no"
    />
    <title>Login</title>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css"
    />
    <link
      rel="stylesheet"
      href="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.css"
    />
    <link rel="stylesheet" th:href="@{/css/puzzle-modal.css}" />
    <style>
      .login-container {
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        background-color: #f8f9fa;
      }
      .login-card {
        max-width: 400px;
        width: 100%;
        padding: 2rem;
        box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
        border-radius: 8px;
        background-color: #ffffff;
      }
      .logo {
        width: 100px;
        height: auto;
        margin-bottom: 1rem;
      }
    </style>
  </head>
  <body>
    <div class="login-container">
      <div class="login-card text-center">
        <img th:src="@{/images/logo.png}" alt="Logo" class="logo" />
        <h3 class="mb-4">Bem-vindo</h3>

        <form id="loginForm">
          <div class="form-group mb-3">
            <label for="username" class="form-label">Usuário</label>
            <input
              type="text"
              class="form-control"
              id="username"
              name="username"
              placeholder="Digite seu nome de usuário"
              autocomplete="username"
              required
            />
          </div>
          <div class="form-group mb-3">
            <label for="password" class="form-label">Senha</label>
            <input
              type="password"
              class="form-control"
              id="password"
              name="password"
              placeholder="Digite sua senha"
              autocomplete="current-password"
              required
            />
          </div>
          <div
            id="error"
            class="text-danger mb-2"
            style="min-height: 1.2em"
          ></div>
          <button type="submit" class="btn btn-primary w-100">Entrar</button>
          <a href="/registrar" class="btn btn-link w-100 mt-2">Criar conta</a>
        </form>
      </div>
    </div>

    <!-- Pop-up do puzzle (2FA) -->
    <div
      class="modal fade"
      id="puzzleModal"
      tabindex="-1"
      aria-labelledby="puzzleTitulo"
      aria-hidden="true"
    >
      <div class="modal-dialog modal-dialog-centered" style="max-width: 460px">
        <div class="modal-content">
          <div class="modal-header">
            <h5 class="modal-title" id="puzzleTitulo">
              Verificação de segurança
            </h5>
            <span class="pz-tempo" id="pz-tempo">05:00</span>
          </div>
          <div class="modal-body">
            <div class="progress pz-progress">
              <div id="pz-barra" class="progress-bar" style="width: 100%"></div>
            </div>
            <div class="d-flex justify-content-between small text-muted mt-2">
              <span id="pz-vez"></span>
              <span id="pz-numero"></span>
            </div>

            <div id="puzzle-board"></div>

            <div id="pz-tentativas" class="pz-dots text-center mb-2"></div>
            <div
              id="pz-msg"
              class="text-center info"
              style="min-height: 1.5em"
            ></div>
          </div>
          <div class="modal-footer">
            <button
              type="button"
              id="pz-cancelar"
              class="btn btn-outline-secondary btn-sm"
            >
              Cancelar
            </button>
          </div>
        </div>
      </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
    <script src="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.js"></script>
    <script th:src="@{/js/puzzle-modal.js}"></script>
    <script>
      document
        .getElementById("loginForm")
        .addEventListener("submit", async (e) => {
          e.preventDefault();
          const err = document.getElementById("error");
          err.textContent = "";

          const params = new URLSearchParams({
            username: e.target.username.value,
            password: e.target.password.value,
          });

          try {
            const resp = await fetch("/api/auth/login", {
              method: "POST",
              body: params,
            });
            const dados = await resp.json().catch(() => ({}));

            if (!resp.ok) {
              err.textContent = dados.erro || "Credenciais inválidas.";
              return;
            }

            e.target.password.value = ""; // não deixa a senha no campo
            PuzzleModal.abrir(dados, {
              aoEncerrar: (mensagem) => {
                err.textContent = mensagem || "";
              },
            });
          } catch (ex) {
            err.textContent = "Erro ao contatar o servidor.";
            console.error(ex);
          }
        });
    </script>
  </body>
</html>
