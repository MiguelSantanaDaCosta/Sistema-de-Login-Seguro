<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <title>Admin — Usuários</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" th:href="@{/css/style.css}" />
  </head>
  <body>
    <aside>
      <div th:replace="~{fragments/sidebar :: sidebar}"></div>
    </aside>

    <div class="container mt-4" th:fragment="content">
      <h2 class="mb-4">Gerenciar Usuários</h2>

      <table class="table table-striped align-middle">
        <thead>
          <tr>
            <th>Usuário</th>
            <th>Email</th>
            <th>Nome</th>
            <th>Perfil</th>
            <th>Ativo</th>
            <th>Ações</th>
          </tr>
        </thead>
        <tbody>
          <tr th:each="u : ${usuarios}">
            <td th:text="${u.username}"></td>
            <td th:text="${u.email}"></td>
            <td th:text="${u.nomeCompleto}"></td>
            <td>
              <form
                th:action="@{'/admin/usuarios/' + ${u.id} + '/role'}"
                method="post"
                class="d-flex"
              >
                <select name="role" class="form-select form-select-sm me-2">
                  <option
                    th:each="r : ${T(com.pfc.thindesk.entity.Role).values()}"
                    th:value="${r.name()}"
                    th:text="${r.name()}"
                    th:selected="${u.roles.contains(r)}"
                  ></option>
                </select>
                <button class="btn btn-sm btn-primary">Salvar</button>
              </form>
            </td>
            <td>
              <span th:if="${u.ativo}" class="badge bg-success">Sim</span>
              <span th:unless="${u.ativo}" class="badge bg-danger">Não</span>
            </td>
            <td>
              <form
                th:action="@{'/admin/usuarios/' + ${u.id} + '/toggle-ativo'}"
                method="post"
                class="d-inline"
              >
                <button class="btn btn-sm btn-warning">
                  <span th:if="${u.ativo}">Desativar</span>
                  <span th:unless="${u.ativo}">Ativar</span>
                </button>
              </form>
            </td>
          </tr>
        </tbody>
      </table>
    </div>

    <script th:src="@{/js/script.js}"></script>
  </body>
</html>
