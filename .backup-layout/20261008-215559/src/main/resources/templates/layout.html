<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Thindesk</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" th:href="@{/css/style.css}" />
    <!-- Tema ativo do usuário (injetado pelo GlobalModelAdvice) -->
    <link
      rel="stylesheet"
      th:if="${temaAtivo != null}"
      th:href="@{'/css/themes/' + ${temaAtivo} + '.css'}"
    />
  </head>
  <body th:attr="data-theme=${temaAtivo}">
    <!-- Botão para abrir/fechar a sidebar em telas pequenas -->
    <div class="toggle-btn btn btn-dark d-md-none">
      <span>&#9776;</span>
    </div>

    <!-- Sidebar -->
    <aside>
      <div th:replace="~{fragments/sidebar :: sidebar}"></div>
    </aside>

    <!-- Conteúdo Principal -->
    <main class="container-fluid mt-4">
      <div th:replace="~{home :: content}"></div>
    </main>

    <script th:src="@{/js/script.js}"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
